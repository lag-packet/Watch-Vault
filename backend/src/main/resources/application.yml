spring:
  application:
    name: watch-vault-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:watch_vault}?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USERNAME:watch_vault}
    password: ${DB_PASSWORD:watch_vault}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
